<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Uang - Google Sheets Sync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex justify-center items-start pt-4 sm:pt-10 px-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden flex flex-col h-[95vh] sm:h-[85vh]">
        
        <header class="bg-indigo-600 text-white p-4">
            <h1 class="text-xl font-bold text-center mb-4">Rekap Keuangan</h1>
            <div class="flex rounded-lg bg-indigo-800 p-1">
                <button id="tab-pribadi" onclick="switchTab('pribadi')" class="flex-1 py-1.5 text-sm font-semibold rounded-md shadow-sm bg-white text-indigo-700 transition-all">Pribadi</button>
                <button id="tab-kantor" onclick="switchTab('kantor')" class="flex-1 py-1.5 text-sm font-semibold rounded-md text-indigo-100 hover:text-white transition-all">Kantor</button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 space-y-5">
            
            <!-- Ringkasan Saldo -->
            <section class="grid grid-cols-2 gap-3">
                <div class="col-span-2 bg-indigo-50 border border-indigo-100 p-3 rounded-xl">
                    <p class="text-xs text-indigo-600 font-semibold mb-1">Total Saldo (Bulan Ini)</p>
                    <h2 id="sum-saldo" class="text-2xl font-bold text-indigo-700">Rp. 0</h2>
                </div>
                <div class="bg-green-50 border border-green-100 p-3 rounded-xl">
                    <p class="text-xs text-green-600 font-semibold mb-1">Masuk</p>
                    <h3 id="sum-masuk" class="text-md font-bold text-green-700">Rp. 0</h3>
                </div>
                <div class="bg-red-50 border border-red-100 p-3 rounded-xl">
                    <p class="text-xs text-red-600 font-semibold mb-1">Keluar</p>
                    <h3 id="sum-keluar" class="text-md font-bold text-red-700">Rp. 0</h3>
                </div>
            </section>

            <!-- Form Input Transaksi -->
            <section class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-gray-700">Transaksi Baru</h2>
                </div>
                
                <div class="space-y-3">
                    <div class="flex space-x-2">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="flow" value="keluar" class="peer sr-only" onchange="updateOptions()" checked>
                            <div class="text-center py-2 rounded-lg border border-gray-300 peer-checked:bg-red-500 peer-checked:text-white peer-checked:border-red-500 text-xs font-bold transition-colors text-gray-600">
                                PENGELUARAN
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="flow" value="masuk" class="peer sr-only" onchange="updateOptions()">
                            <div class="text-center py-2 rounded-lg border border-gray-300 peer-checked:bg-green-500 peer-checked:text-white peer-checked:border-green-500 text-xs font-bold transition-colors text-gray-600">
                                PEMASUKAN
                            </div>
                        </label>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <select id="input-source" class="p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="CASH">💵 CASH</option>
                            <option value="BCA">💳 BCA</option>
                            <option value="BRI">💳 BRI</option>
                            <option value="BANK JATIM">💳 JATIM</option>
                        </select>
                        <input type="tel" id="input-amount" inputmode="numeric" oninput="formatInputRupiah(this)" onkeyup="handleEnter(event)" placeholder="Nominal" class="p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none font-bold">
                    </div>
                    
                    <div class="space-y-2">
                        <select id="select-desc" onchange="toggleManualDesc()" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                        </select>
                        <input type="text" id="input-desc-manual" onkeyup="handleEnter(event)" placeholder="Tulis keterangan manual..." class="hidden w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    
                    <button id="btn-submit" onclick="saveData()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-sm shadow-md transition-all active:scale-95">
                        Simpan Data (Enter)
                    </button>

                    <!-- Indikator Status Cloud -->
                    <div id="alert-no-url" class="mt-2 p-2 bg-orange-100 border border-orange-200 rounded text-[10px] text-orange-700 font-semibold text-center hidden">
                        ⚠️ SCRIPT_URL belum diisi! Data hanya tersimpan di HP ini.
                    </div>
                    <p id="cloud-status" class="text-[10px] text-center text-gray-500 hidden font-semibold mt-2"></p>
                </div>
            </section>

            <!-- Riwayat -->
            <section>
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-gray-700">Riwayat Lokal</h2>
                    <button onclick="downloadPDF()" class="text-xs text-indigo-600 font-bold hover:underline">Cetak PDF</button>
                </div>
                <div id="list-history" class="space-y-2 pb-6"></div>
            </section>
        </div>
    </div>

    <script>
        /**
         * PENTING: Masukkan URL hasil Deploy Web App Apps Script Anda di sini.
         * Contoh: https://script.google.com/macros/s/AKfycb.../exec
         */
        const SCRIPT_URL = ''; 
        
        let currentTab = 'pribadi';
        let entries = JSON.parse(localStorage.getItem('rekap_uang_v3')) || [];

        const OPTIONS_PRIBADI = ["Bensin", "Makanan", "Belanja Online", "Belanja Offline", "Listrik", "Wifi", "PDAM", "Lain Lain"];
        const OPTIONS_KANTOR_OUT = ["GB", "Primamax", "Warna", "Pak Burhan", "GFBABAT", "IndahPrint", "QueenDistro", "Lain Lain"];
        const OPTIONS_KANTOR_IN = ["Pembayaran", "Gajipribadi", "Lain Lain"];

        function handleEnter(event) {
            if (event.key === "Enter") saveData();
        }

        function formatRupiah(angka) {
            return 'Rp. ' + new Intl.NumberFormat('id-ID').format(angka);
        }

        function formatInputRupiah(input) {
            let value = input.value.replace(/[^,\d]/g, '').toString();
            let split = value.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);
            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }
            input.value = rupiah ? 'Rp. ' + rupiah : '';
        }

        function unformatRupiah(str) {
            if (!str) return 0;
            return parseInt(str.replace(/[^0-9]/g, '')) || 0;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-pribadi').className = tab === 'pribadi' ? "flex-1 py-1.5 text-sm font-semibold rounded-md shadow-sm bg-white text-indigo-700 transition-all" : "flex-1 py-1.5 text-sm font-semibold rounded-md text-indigo-100 hover:text-white transition-all";
            document.getElementById('tab-kantor').className = tab === 'kantor' ? "flex-1 py-1.5 text-sm font-semibold rounded-md shadow-sm bg-white text-indigo-700 transition-all" : "flex-1 py-1.5 text-sm font-semibold rounded-md text-indigo-100 hover:text-white transition-all";
            updateOptions();
            render();
        }

        function updateOptions() {
            const select = document.getElementById('select-desc');
            const flow = document.querySelector('input[name="flow"]:checked').value;
            let options = currentTab === 'pribadi' ? OPTIONS_PRIBADI : (flow === 'masuk' ? OPTIONS_KANTOR_IN : OPTIONS_KANTOR_OUT);
            select.innerHTML = options.map(opt => `<option value="${opt}">${opt}</option>`).join('');
            toggleManualDesc();
        }

        function toggleManualDesc() {
            const select = document.getElementById('select-desc');
            const manualInput = document.getElementById('input-desc-manual');
            if (select.value === "Lain Lain") {
                manualInput.classList.remove('hidden');
                manualInput.focus();
            } else {
                manualInput.classList.add('hidden');
                manualInput.value = '';
            }
        }

        async function saveData() {
            const amountInput = document.getElementById('input-amount').value;
            const amount = unformatRupiah(amountInput);
            const selectVal = document.getElementById('select-desc').value;
            const manualVal = document.getElementById('input-desc-manual').value;
            const source = document.getElementById('input-source').value;
            const flow = document.querySelector('input[name="flow"]:checked').value;
            const statusEl = document.getElementById('cloud-status');

            let desc = selectVal === "Lain Lain" ? manualVal : selectVal;

            if (!amount || amount <= 0) return;
            if (!desc.trim()) return;

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "⌛ Memproses...";

            // Menyiapkan data untuk dikirim ke Google Sheets (Sesuai parameter di Apps Script Anda)
            const newEntry = {
                category: currentTab === 'pribadi' ? 'Pribadi' : 'Kantor',
                flow: flow === 'masuk' ? 'Masuk' : 'Keluar',
                source: source,
                amount: amount,
                description: desc
            };

            // Simpan Lokal untuk Riwayat di HP
            const localEntry = { ...newEntry, id: Date.now().toString(), date: new Date().toISOString(), type: currentTab };
            entries.push(localEntry);
            localStorage.setItem('rekap_uang_v3', JSON.stringify(entries));

            // Kirim ke Google Sheets jika URL tersedia
            if (SCRIPT_URL && SCRIPT_URL.startsWith('http')) {
                statusEl.innerText = "☁️ Mengirim ke Google Sheets...";
                statusEl.classList.remove('hidden', 'text-red-500', 'text-green-600');
                statusEl.classList.add('text-gray-500');
                
                try {
                    const params = new URLSearchParams();
                    // Ini akan diterima sebagai e.parameter di Apps Script
                    for (const key in newEntry) params.append(key, newEntry[key]);

                    // Gunakan mode no-cors untuk menghindari blokir CORS (umum di Apps Script)
                    await fetch(SCRIPT_URL, { 
                        method: 'POST', 
                        body: params, 
                        mode: 'no-cors'
                    });
                    
                    statusEl.innerText = "✅ Berhasil Masuk Database!";
                    statusEl.classList.replace('text-gray-500', 'text-green-600');
                    setTimeout(() => statusEl.classList.add('hidden'), 5000);
                } catch (e) {
                    console.error(e);
                    statusEl.innerText = "❌ Gagal Sinkron. Cek Koneksi/URL.";
                    statusEl.classList.replace('text-gray-500', 'text-red-500');
                }
            } else {
                document.getElementById('alert-no-url').classList.remove('hidden');
                setTimeout(() => document.getElementById('alert-no-url').classList.add('hidden'), 5000);
            }

            // Reset UI
            document.getElementById('input-amount').value = '';
            document.getElementById('input-desc-manual').value = '';
            btnSubmit.disabled = false;
            btnSubmit.innerText = "Simpan Data (Enter)";
            render();
            document.getElementById('input-amount').focus();
        }

        function render() {
            const listContainer = document.getElementById('list-history');
            listContainer.innerHTML = '';
            const filtered = entries.filter(e => e.type === currentTab);
            let inSum = 0, outSum = 0;
            const now = new Date();

            // Check URL on load
            if (!SCRIPT_URL) document.getElementById('alert-no-url').classList.remove('hidden');

            filtered.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(entry => {
                const d = new Date(entry.date);
                // Hanya hitung saldo bulan ini
                if (d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) {
                    if (entry.flow === 'Masuk') inSum += entry.amount; else outSum += entry.amount;
                }
                
                const isIn = entry.flow === 'Masuk';
                const el = document.createElement('div');
                el.className = "bg-white p-3 rounded-xl border border-gray-100 shadow-sm flex justify-between items-center";
                el.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center text-[10px] font-bold ${isIn ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                            ${isIn ? 'IN' : 'OUT'}
                        </div>
                        <div>
                            <p class="text-sm font-bold text-gray-800">${entry.description}</p>
                            <p class="text-[10px] text-gray-400">${d.toLocaleDateString('id-ID')} • ${entry.source}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold ${isIn ? 'text-green-600' : 'text-red-600'}">
                            ${isIn ? '+' : '-'}${formatRupiah(entry.amount)}
                        </p>
                        <button onclick="deleteItem('${entry.id}')" class="text-[10px] text-gray-300 hover:text-red-500">Hapus</button>
                    </div>
                `;
                listContainer.appendChild(el);
            });

            document.getElementById('sum-saldo').innerText = formatRupiah(inSum - outSum);
            document.getElementById('sum-masuk').innerText = formatRupiah(inSum);
            document.getElementById('sum-keluar').innerText = formatRupiah(outSum);
        }

        function deleteItem(id) {
            if(confirm("Hapus data dari riwayat lokal? (Ini tidak menghapus data di Google Sheets)")) {
                entries = entries.filter(e => e.id !== id);
                localStorage.setItem('rekap_uang_v3', JSON.stringify(entries));
                render();
            }
        }

        function downloadPDF() {
            if (entries.length === 0) return alert("Data kosong.");
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Laporan Rekap Uang - " + currentTab.toUpperCase(), 14, 15);
            const rows = entries.filter(e => e.type === currentTab).map(e => [
                new Date(e.date).toLocaleDateString(), e.flow.toUpperCase(), e.description, e.source, formatRupiah(e.amount)
            ]);
            doc.autoTable({ head: [['Tgl', 'Arus', 'Ket', 'Src', 'Nominal']], body: rows, startY: 20 });
            doc.save(`rekap_${currentTab}.pdf`);
        }

        updateOptions();
        render();
    </script>
</body>
</html>
