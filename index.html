<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rekap Uang Pro - Numpad Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
            overscroll-behavior-y: contain;
        }
        .tab-active { background-color: white; color: #4f46e5; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            padding: 8px 0;
        }
        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 20s linear infinite;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: #6366f1;
        }
        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        /* Numpad Styling */
        .numpad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .btn-numpad {
            @apply flex items-center justify-center h-14 md:h-16 bg-white border border-slate-200 rounded-2xl text-xl font-black text-slate-700 active:bg-indigo-600 active:text-white transition-all shadow-sm;
        }
        .btn-op {
            @apply bg-slate-100 text-indigo-600;
        }
        .btn-action {
            @apply bg-indigo-600 text-white border-none;
        }
        
        @media (orientation: landscape) and (max-height: 500px) {
            .numpad-grid { grid-template-columns: repeat(8, 1fr); }
            .btn-numpad { h-12; }
        }
    </style>
</head>
<body class="text-gray-900 antialiased h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shrink-0 shadow-lg z-10">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex flex-col">
                <p id="display-date" class="text-[10px] uppercase tracking-widest font-black opacity-70">Memuat...</p>
                <h1 id="display-time" class="text-xl md:text-2xl font-black">00:00:00</h1>
            </div>
            <div class="flex gap-2">
                <button id="tab-pribadi-d" onclick="switchTab('pribadi')" class="px-4 py-2 text-[10px] font-bold rounded-lg transition-all tab-active">Pribadi</button>
                <button id="tab-kantor-d" onclick="switchTab('kantor')" class="px-4 py-2 text-[10px] font-bold rounded-lg transition-all">Kantor</button>
                <button onclick="toggleSettings()" class="p-2 bg-indigo-500 rounded-xl hover:bg-indigo-400 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Marquee -->
    <div class="marquee-container shrink-0">
        <div class="marquee-text" id="running-text-display">Rekap Uang Pro Numpad Edition • Ketik nominal dengan mudah menggunakan tombol angka</div>
    </div>

    <!-- Main Content -->
    <main class="flex-1 overflow-hidden relative">
        <div id="scroll-area" class="h-full overflow-y-auto px-4 py-4">
            <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                <!-- Input Section -->
                <div class="lg:col-span-5 space-y-4">
                    <div class="bg-indigo-600 p-5 rounded-3xl text-white shadow-xl">
                        <p class="text-[9px] font-black uppercase opacity-60 mb-1">Total Saldo (Estimasi)</p>
                        <h2 id="sum-saldo" class="text-3xl font-black">Rp 0</h2>
                    </div>

                    <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                        <!-- Mode Toggle -->
                        <div class="flex p-1 bg-slate-100 rounded-2xl">
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="flow" value="keluar" class="peer sr-only" onchange="updateOptions()" checked>
                                <div class="text-center py-2.5 rounded-xl peer-checked:bg-white peer-checked:text-red-600 peer-checked:shadow-sm text-[10px] font-black transition-all text-slate-500 uppercase">Keluar</div>
                            </label>
                            <label class="flex-1 cursor-pointer">
                                <input type="radio" name="flow" value="masuk" class="peer sr-only" onchange="updateOptions()">
                                <div class="text-center py-2.5 rounded-xl peer-checked:bg-white peer-checked:text-green-600 peer-checked:shadow-sm text-[10px] font-black transition-all text-slate-500 uppercase">Masuk</div>
                            </label>
                        </div>

                        <!-- Main Input Area -->
                        <div class="space-y-2">
                            <div class="relative bg-slate-50 rounded-2xl p-4 border-2 border-transparent focus-within:border-indigo-500 transition-all">
                                <div class="flex justify-between items-end">
                                    <span class="text-slate-400 font-black text-lg">Rp</span>
                                    <div id="display-numpad" class="text-3xl font-black text-slate-900 truncate text-right w-full">0</div>
                                </div>
                                <div id="math-formula" class="text-[10px] text-indigo-500 font-bold text-right h-4 mt-1 opacity-60"></div>
                            </div>

                            <!-- THE NUMPAD -->
                            <div class="numpad-grid">
                                <button onclick="pressNum('7')" class="btn-numpad">7</button>
                                <button onclick="pressNum('8')" class="btn-numpad">8</button>
                                <button onclick="pressNum('9')" class="btn-numpad">9</button>
                                <button onclick="pressOp('/')" class="btn-numpad btn-op">÷</button>
                                
                                <button onclick="pressNum('4')" class="btn-numpad">4</button>
                                <button onclick="pressNum('5')" class="btn-numpad">5</button>
                                <button onclick="pressNum('6')" class="btn-numpad">6</button>
                                <button onclick="pressOp('*')" class="btn-numpad btn-op">×</button>
                                
                                <button onclick="pressNum('1')" class="btn-numpad">1</button>
                                <button onclick="pressNum('2')" class="btn-numpad">2</button>
                                <button onclick="pressNum('3')" class="btn-numpad">3</button>
                                <button onclick="pressOp('-')" class="btn-numpad btn-op">-</button>
                                
                                <button onclick="pressNum('0')" class="btn-numpad">0</button>
                                <button onclick="pressNum('000')" class="btn-numpad text-sm">.000</button>
                                <button onclick="pressClear()" class="btn-numpad text-red-500 font-black">C</button>
                                <button onclick="pressOp('+')" class="btn-numpad btn-op">+</button>
                            </div>

                            <div class="flex gap-2">
                                <select id="input-source" class="w-1/3 p-4 bg-slate-50 rounded-xl text-[10px] font-black outline-none border-none">
                                    <option value="CASH">💵 CASH</option>
                                    <option value="BCA">💳 BCA</option>
                                    <option value="BRI">💳 BRI</option>
                                    <option value="BANK JATIM">💳 JATIM</option>
                                </select>
                                <select id="select-desc" onchange="toggleManualDesc()" class="w-2/3 p-4 bg-slate-50 rounded-xl text-[10px] font-black outline-none border-none"></select>
                            </div>
                            <input type="text" id="input-desc-manual" placeholder="Keterangan manual..." class="hidden w-full p-4 bg-slate-50 rounded-xl text-xs font-black outline-none border-none">
                            
                            <button onclick="saveData()" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl text-sm shadow-lg shadow-indigo-100 active:scale-95 transition-all">SIMPAN DATA</button>
                        </div>
                    </div>
                </div>

                <!-- History Section -->
                <div class="lg:col-span-7">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Aktivitas Hari Ini</h2>
                    </div>
                    <div id="list-history" class="space-y-3">
                        <!-- List Items -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Settings Overlay -->
    <div id="settings-overlay" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl">
            <h2 class="text-xl font-black mb-6">Saldo Sekarang</h2>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div><p class="text-[9px] font-bold text-slate-400">TUNAI</p><input type="number" id="start-cash" class="w-full p-3 bg-slate-100 rounded-xl font-bold"></div>
                <div><p class="text-[9px] font-bold text-slate-400">BCA</p><input type="number" id="start-bca" class="w-full p-3 bg-slate-100 rounded-xl font-bold"></div>
                <div><p class="text-[9px] font-bold text-slate-400">BRI</p><input type="number" id="start-bri" class="w-full p-3 bg-slate-100 rounded-xl font-bold"></div>
                <div><p class="text-[9px] font-bold text-slate-400">JATIM</p><input type="number" id="start-jatim" class="w-full p-3 bg-slate-100 rounded-xl font-bold"></div>
            </div>
            <button onclick="saveBalances()" class="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black mb-2">UPDATE SALDO</button>
            <button onclick="toggleSettings()" class="w-full py-4 text-slate-400 font-bold">TUTUP</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKWnWGwyxEFgXGmlXZdDxZgIh9IGLiBS-_Grk8eb2wDaZeWnPBxXy_bRYQBvBi0dR6iw/exec';

        let currentTab = 'pribadi';
        let rawExpression = ""; 
        let finalValue = 0;
        let entries = JSON.parse(localStorage.getItem('rekap_numpad_data')) || [];
        let startBals = JSON.parse(localStorage.getItem('rekap_numpad_start')) || { CASH: 0, BCA: 0, BRI: 0, JATIM: 0 };
        
        const config = {
            pribadi: "Makan, Bensin, Parkir, Belanja, Pulsa, Listrik, Sedekah",
            kantorIn: "Invoice, Gaji, Refund, Bonus",
            kantorOut: "GB, Primamax, Warna, Pak Burhan, GFBABAT, IndahPrint, ATK"
        };

        function formatNumber(num) { return new Intl.NumberFormat('id-ID').format(num); }

        function updateClock() {
            const now = new Date();
            document.getElementById('display-time').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
            document.getElementById('display-date').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Numpad Logic
        function pressNum(num) {
            rawExpression += num;
            updateDisplay();
        }

        function pressOp(op) {
            // Avoid double operators
            if (rawExpression === "" && op !== "-") return;
            const lastChar = rawExpression.slice(-1);
            if (["+", "-", "*", "/"].includes(lastChar)) {
                rawExpression = rawExpression.slice(0, -1) + op;
            } else {
                rawExpression += op;
            }
            updateDisplay();
        }

        function pressClear() {
            rawExpression = "";
            finalValue = 0;
            updateDisplay();
        }

        function updateDisplay() {
            const display = document.getElementById('display-numpad');
            const formula = document.getElementById('math-formula');
            
            if (rawExpression === "") {
                display.innerText = "0";
                formula.innerText = "";
                finalValue = 0;
                return;
            }

            formula.innerText = rawExpression.replace(/\*/g, '×').replace(/\//g, '÷');
            
            try {
                // Safety: remove non-math chars
                const clean = rawExpression.replace(/[^0-9+\-*/.]/g, '');
                const result = Function('"use strict";return (' + clean + ')')();
                finalValue = Math.round(result || 0);
                display.innerText = formatNumber(finalValue);
            } catch (e) {
                // Keep showing previous valid result if mid-expression
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-pribadi-d').classList.toggle('tab-active', tab === 'pribadi');
            document.getElementById('tab-kantor-d').classList.toggle('tab-active', tab === 'kantor');
            updateOptions();
            render();
        }

        function toggleSettings() {
            document.getElementById('settings-overlay').classList.toggle('hidden');
            document.getElementById('start-cash').value = startBals.CASH;
            document.getElementById('start-bca').value = startBals.BCA;
            document.getElementById('start-bri').value = startBals.BRI;
            document.getElementById('start-jatim').value = startBals.JATIM;
        }

        function saveBalances() {
            startBals.CASH = parseFloat(document.getElementById('start-cash').value) || 0;
            startBals.BCA = parseFloat(document.getElementById('start-bca').value) || 0;
            startBals.BRI = parseFloat(document.getElementById('start-bri').value) || 0;
            startBals.JATIM = parseFloat(document.getElementById('start-jatim').value) || 0;
            localStorage.setItem('rekap_numpad_start', JSON.stringify(startBals));
            toggleSettings();
            render();
        }

        function updateOptions() {
            const sel = document.getElementById('select-desc');
            const flow = document.querySelector('input[name="flow"]:checked').value;
            let opts = currentTab === 'pribadi' ? config.pribadi.split(',') : (flow === 'masuk' ? config.kantorIn.split(',') : config.kantorOut.split(','));
            opts.push("Lain Lain");
            sel.innerHTML = opts.map(o => `<option value="${o.trim()}">${o.trim()}</option>`).join('');
            toggleManualDesc();
        }

        function toggleManualDesc() {
            const sel = document.getElementById('select-desc');
            const manual = document.getElementById('input-desc-manual');
            manual.classList.toggle('hidden', sel.value !== "Lain Lain");
        }

        function saveData() {
            if (finalValue <= 0) return;
            const flow = document.querySelector('input[name="flow"]:checked').value;
            const source = document.getElementById('input-source').value;
            const desc = document.getElementById('select-desc').value === "Lain Lain" ? document.getElementById('input-desc-manual').value : document.getElementById('select-desc').value;

            if (!desc) return;

            const entry = {
                id: Date.now().toString(),
                date: new Date().toISOString(),
                type: currentTab,
                flow: flow === 'masuk' ? 'Masuk' : 'Keluar',
                source: source,
                amount: finalValue,
                description: desc
            };

            entries.push(entry);
            localStorage.setItem('rekap_numpad_data', JSON.stringify(entries));
            
            pressClear();
            document.getElementById('input-desc-manual').value = '';
            render();
            sync(entry);
        }

        async function sync(data) {
            try { await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) }); } catch (e) {}
        }

        function render() {
            const list = document.getElementById('list-history');
            list.innerHTML = '';
            let filtered = entries.filter(e => e.type === currentTab);
            
            filtered.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(e => {
                const isMasuk = e.flow === 'Masuk';
                const div = document.createElement('div');
                div.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-50 flex justify-between items-center";
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-[8px] font-black ${isMasuk ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">${e.source}</div>
                        <div>
                            <p class="text-[11px] font-black text-slate-800">${e.description}</p>
                            <p class="text-[8px] text-slate-400 font-bold">${new Date(e.date).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xs font-black ${isMasuk ? 'text-green-600' : 'text-red-600'}">${isMasuk ? '+' : '-'}${formatNumber(e.amount)}</p>
                        <button onclick="deleteItem('${e.id}')" class="text-[8px] text-slate-300 font-black">Hapus</button>
                    </div>
                `;
                list.appendChild(div);
            });

            // Calc balances
            const bals = { ...startBals };
            entries.forEach(e => {
                const s = e.source === 'BANK JATIM' ? 'JATIM' : e.source;
                if (e.flow === 'Masuk') bals[s] += e.amount; else bals[s] -= e.amount;
            });
            const total = Object.values(bals).reduce((a, b) => a + b, 0);
            document.getElementById('sum-saldo').innerText = "Rp " + formatNumber(total);
        }

        function deleteItem(id) {
            if (confirm("Hapus?")) {
                entries = entries.filter(e => e.id !== id);
                localStorage.setItem('rekap_numpad_data', JSON.stringify(entries));
                render();
            }
        }

        updateOptions();
        render();
    </script>
</body>
</html>
