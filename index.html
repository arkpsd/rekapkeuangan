<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Uang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load JSPDF for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex justify-center items-start pt-4 sm:pt-10 px-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden flex flex-col h-[95vh] sm:h-[85vh]">
        
        <!-- Header & Tabs -->
        <header class="bg-indigo-600 text-white p-4">
            <h1 class="text-xl font-bold text-center mb-4">Rekap Keuangan</h1>
            <div class="flex rounded-lg bg-indigo-800 p-1">
                <button id="tab-pribadi" onclick="switchTab('pribadi')" class="flex-1 py-1.5 text-sm font-semibold rounded-md shadow-sm bg-white text-indigo-700 transition-all">Pribadi</button>
                <button id="tab-kantor" onclick="switchTab('kantor')" class="flex-1 py-1.5 text-sm font-semibold rounded-md text-indigo-100 hover:text-white transition-all">Kantor</button>
            </div>
        </header>

        <!-- Main Content Scrollable -->
        <div class="flex-1 overflow-y-auto p-4 space-y-5">
            
            <!-- Summary Dashboard -->
            <section class="grid grid-cols-2 gap-3">
                <div class="col-span-2 bg-indigo-50 border border-indigo-100 p-3 rounded-xl">
                    <p class="text-xs text-indigo-600 font-semibold mb-1">Total Saldo (Bulan Ini)</p>
                    <h2 id="sum-saldo" class="text-2xl font-bold text-indigo-700">Rp. 0</h2>
                </div>
                <div class="bg-green-50 border border-green-100 p-3 rounded-xl">
                    <p class="text-xs text-green-600 font-semibold mb-1">Masuk (Bulan Ini)</p>
                    <h3 id="sum-masuk" class="text-md font-bold text-green-700">Rp. 0</h3>
                </div>
                <div class="bg-red-50 border border-red-100 p-3 rounded-xl">
                    <p class="text-xs text-red-600 font-semibold mb-1">Keluar (Bulan Ini)</p>
                    <h3 id="sum-keluar" class="text-md font-bold text-red-700">Rp. 0</h3>
                </div>
            </section>

            <!-- Input Form -->
            <section class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-gray-700">Catat Transaksi Baru</h2>
                    <label class="cursor-pointer bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-200 transition shadow-sm flex items-center space-x-1">
                        <span>📷 Scan Struk (AI)</span>
                        <input type="file" id="input-struk" accept="image/*" capture="environment" class="hidden" onchange="processReceipt(event)">
                    </label>
                </div>
                
                <div id="scan-status" class="hidden text-xs font-medium mb-3 px-2 py-1.5 rounded-md"></div>
                
                <div class="space-y-3">
                    <div class="flex space-x-2">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="flow" value="keluar" class="peer sr-only" checked>
                            <div class="text-center py-2 rounded-lg border border-gray-300 peer-checked:bg-red-500 peer-checked:text-white peer-checked:border-red-500 text-sm font-medium transition-colors text-gray-600">
                                ⬆️ Keluar
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="flow" value="masuk" class="peer sr-only">
                            <div class="text-center py-2 rounded-lg border border-gray-300 peer-checked:bg-green-500 peer-checked:text-white peer-checked:border-green-500 text-sm font-medium transition-colors text-gray-600">
                                ⬇️ Masuk
                            </div>
                        </label>
                    </div>

                    <div>
                        <select id="input-source" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="CASH">💵 CASH (Tunai)</option>
                            <option value="BCA">💳 BCA</option>
                            <option value="BRI">💳 BRI</option>
                            <option value="BANK JATIM">💳 BANK JATIM</option>
                        </select>
                    </div>

                    <div>
                        <input type="text" id="input-amount" oninput="formatInputRupiah(this)" placeholder="Nominal (Rp)" class="w-full pl-3 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none font-semibold text-gray-800">
                    </div>
                    
                    <div>
                        <input type="text" id="input-desc" placeholder="Keterangan (Cth: Beli makan, Gaji)" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    
                    <button id="btn-submit" onclick="saveData()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg text-sm shadow-md transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        Simpan Catatan
                    </button>
                </div>
            </section>

            <!-- History List -->
            <section>
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-gray-700">Riwayat Terakhir</h2>
                    <div class="flex space-x-3">
                        <button onclick="downloadPDF()" class="text-xs text-indigo-600 font-semibold hover:text-indigo-800">📄 Download PDF</button>
                        <button onclick="clearAllData()" class="text-xs text-red-500 hover:text-red-700">🗑️ Hapus</button>
                    </div>
                </div>
                <div id="list-history" class="space-y-2 pb-4"></div>
            </section>
        </div>
    </div>

    <script>
        // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI SINI
        const SCRIPT_URL = ''; 
        
        let currentTab = 'pribadi';
        let entries = JSON.parse(localStorage.getItem('rekap_uang_v2')) || [];

        function formatRupiah(angka) {
            return 'Rp. ' + new Intl.NumberFormat('id-ID').format(angka);
        }

        function formatInputRupiah(input) {
            let value = input.value.replace(/[^,\d]/g, '').toString();
            let split = value.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);
            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }
            rupiah = split[1] != undefined ? rupiah + ',' + split[1] : rupiah;
            input.value = rupiah ? 'Rp. ' + rupiah : '';
        }

        function unformatRupiah(str) {
            if (!str) return 0;
            return parseInt(str.replace(/[^0-9]/g, '')) || 0;
        }

        function switchTab(tab) {
            currentTab = tab;
            const btnPribadi = document.getElementById('tab-pribadi');
            const btnKantor = document.getElementById('tab-kantor');
            if(tab === 'pribadi') {
                btnPribadi.className = "flex-1 py-1.5 text-sm font-semibold rounded-md shadow-sm bg-white text-indigo-700 transition-all";
                btnKantor.className = "flex-1 py-1.5 text-sm font-semibold rounded-md text-indigo-100 hover:text-white transition-all";
            } else {
                btnKantor.className = "flex-1 py-1.5 text-sm font-semibold rounded-md shadow-sm bg-white text-indigo-700 transition-all";
                btnPribadi.className = "flex-1 py-1.5 text-sm font-semibold rounded-md text-indigo-100 hover:text-white transition-all";
            }
            render();
        }

        async function saveData() {
            const amountInput = document.getElementById('input-amount').value;
            const amount = unformatRupiah(amountInput);
            const desc = document.getElementById('input-desc').value;
            const source = document.getElementById('input-source').value;
            const flow = document.querySelector('input[name="flow"]:checked').value;

            if (!amount || amount <= 0) { alert("Nominal tidak valid!"); return; }
            if (!desc.trim()) { alert("Keterangan tidak boleh kosong!"); return; }

            const btnSubmit = document.getElementById('btn-submit');
            const originalBtnText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = "⏳ Menyimpan...";
            btnSubmit.disabled = true;

            const newEntry = {
                id: Date.now().toString(),
                date: new Date().toISOString(),
                type: currentTab,
                flow: flow,
                source: source,
                amount: amount,
                desc: desc
            };

            // Simpan lokal
            entries.push(newEntry);
            localStorage.setItem('rekap_uang_v2', JSON.stringify(entries));

            // Simpan ke Google Sheets jika SCRIPT_URL diisi
            if (SCRIPT_URL && SCRIPT_URL !== '') {
                try {
                    await fetch(SCRIPT_URL, { 
                        method: 'POST', 
                        mode: 'no-cors', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newEntry) 
                    });
                } catch (error) { 
                    console.error("Gagal sinkron ke Sheets:", error); 
                }
            }

            document.getElementById('input-amount').value = '';
            document.getElementById('input-desc').value = '';
            btnSubmit.innerHTML = originalBtnText;
            btnSubmit.disabled = false;
            render();
        }

        function deleteEntry(id) {
            if(confirm("Hapus catatan ini?")) {
                entries = entries.filter(e => e.id !== id);
                localStorage.setItem('rekap_uang_v2', JSON.stringify(entries));
                render();
            }
        }

        function clearAllData() {
            if(confirm("Hapus semua catatan di HP ini?")) {
                entries = [];
                localStorage.removeItem('rekap_uang_v2');
                render();
            }
        }

        function render() {
            const listContainer = document.getElementById('list-history');
            listContainer.innerHTML = '';
            const filteredEntries = entries.filter(e => e.type === currentTab);
            let totalMasuk = 0, totalKeluar = 0;
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();
            const sortedEntries = [...filteredEntries].sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedEntries.forEach(entry => {
                const dateObj = new Date(entry.date);
                if (dateObj.getMonth() === currentMonth && dateObj.getFullYear() === currentYear) {
                    if (entry.flow === 'masuk') totalMasuk += entry.amount;
                    if (entry.flow === 'keluar') totalKeluar += entry.amount;
                }
                const dateStr = dateObj.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                const timeStr = dateObj.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                const isMasuk = entry.flow === 'masuk';
                
                const card = document.createElement('div');
                card.className = "bg-white p-3 rounded-lg border border-gray-100 shadow-sm flex justify-between items-center";
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full flex items-center justify-center ${isMasuk ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                            ${isMasuk ? '⬇️' : '⬆️'}
                        </div>
                        <div>
                            <p class="text-sm font-semibold text-gray-800">${entry.desc}</p>
                            <div class="flex items-center space-x-2 text-xs text-gray-500 mt-0.5">
                                <span>${dateStr} (${timeStr})</span>
                                <span>•</span>
                                <span class="font-medium bg-gray-100 px-1.5 py-0.5 rounded text-gray-600">${entry.source}</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold ${isMasuk ? 'text-green-600' : 'text-red-600'}">
                            ${isMasuk ? '+' : '-'}${formatRupiah(entry.amount)}
                        </p>
                        <button onclick="deleteEntry('${entry.id}')" class="text-xs text-gray-400 hover:text-red-500 mt-1">Hapus</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
            
            if (sortedEntries.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-xs text-gray-400 py-4">Belum ada catatan.</p>`;
            }
            
            const saldo = totalMasuk - totalKeluar;
            document.getElementById('sum-saldo').innerText = formatRupiah(saldo);
            document.getElementById('sum-masuk').innerText = formatRupiah(totalMasuk);
            document.getElementById('sum-keluar').innerText = formatRupiah(totalKeluar);
        }

        async function processReceipt(event) {
            const file = event.target.files[0];
            if (!file) return;
            const statusDiv = document.getElementById('scan-status');
            
            statusDiv.className = "text-xs font-medium mb-3 px-2 py-1.5 rounded-md bg-blue-100 text-blue-700 animate-pulse";
            statusDiv.innerText = "⏳ AI sedang membaca struk & menyimpan data...";
            statusDiv.classList.remove('hidden');
            
            try {
                const base64Data = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
                
                const payload = {
                    contents: [{ 
                        role: "user", 
                        parts: [
                            { text: "Baca struk ini. Berikan total bayar (amount) dan nama toko (desc). Format JSON: {'amount': integer, 'desc': string}" }, 
                            { inlineData: { mimeType: file.type, data: base64Data } }
                        ] 
                    }],
                    generationConfig: { 
                        responseMimeType: "application/json", 
                        responseSchema: { 
                            type: "OBJECT", 
                            properties: { 
                                amount: { type: "INTEGER" }, 
                                desc: { type: "STRING" } 
                            }, 
                            required: ["amount", "desc"] 
                        } 
                    }
                };
                
                const apiKey = ""; 
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.candidates && result.candidates[0].content.parts[0].text) {
                    const data = JSON.parse(result.candidates[0].content.parts[0].text);
                    
                    // Isi formulir secara visual (opsional, agar user tahu apa yang dibaca)
                    document.getElementById('input-amount').value = data.amount.toString();
                    formatInputRupiah(document.getElementById('input-amount'));
                    document.getElementById('input-desc').value = data.desc;
                    document.querySelector('input[name="flow"][value="keluar"]').checked = true;

                    // OTOMATIS SIMPAN KE DATABASE
                    await saveData();
                    
                    statusDiv.className = "text-xs font-medium mb-3 px-2 py-1.5 rounded-md bg-green-100 text-green-700";
                    statusDiv.innerText = "✅ Struk terbaca & Berhasil disimpan ke database!";
                }
            } catch (error) {
                console.error("Scan Error:", error);
                statusDiv.className = "text-xs font-medium mb-3 px-2 py-1.5 rounded-md bg-red-100 text-red-700";
                statusDiv.innerText = "❌ Gagal membaca/menyimpan data struk.";
            } finally {
                setTimeout(() => statusDiv.classList.add('hidden'), 5000);
            }
        }

        // --- PDF GENERATION ---
        function downloadPDF() {
            if (entries.length === 0) { alert("Data masih kosong."); return; }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

            doc.setFontSize(20);
            doc.setTextColor(79, 70, 229);
            doc.text("Laporan Rekap Keuangan", 14, 20);
            doc.setFontSize(10);
            doc.setTextColor(100);
            doc.text(`Periode Cetak: ${today}`, 14, 28);

            const createTableData = (type) => {
                const data = entries.filter(e => e.type === type).sort((a,b) => new Date(a.date) - new Date(b.date));
                let masuk = 0, keluar = 0;
                const rows = data.map(e => {
                    const d = new Date(e.date);
                    if(e.flow === 'masuk') masuk += e.amount; else keluar += e.amount;
                    return [
                        `${d.toLocaleDateString('id-ID')} ${d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'})}`,
                        e.flow === 'masuk' ? 'MASUK' : 'KELUAR',
                        e.source,
                        e.desc,
                        formatRupiah(e.amount)
                    ];
                });
                return { rows, summary: { masuk, keluar, saldo: masuk - keluar } };
            };

            let finalY = 35;
            const sections = [
                { title: "REKAP UANG PRIBADI", type: "pribadi", color: [79, 70, 229] },
                { title: "REKAP UANG KANTOR", type: "kantor", color: [31, 41, 55] }
            ];

            sections.forEach((sec, idx) => {
                const res = createTableData(sec.type);
                
                doc.setFontSize(12);
                doc.setTextColor(0);
                doc.setFont(undefined, 'bold');
                doc.text(sec.title, 14, finalY);
                doc.setFont(undefined, 'normal');
                
                doc.autoTable({
                    startY: finalY + 5,
                    head: [['Waktu', 'Arus', 'Sumber', 'Keterangan', 'Nominal']],
                    body: res.rows,
                    theme: 'grid',
                    headStyles: { fillColor: sec.color },
                    styles: { fontSize: 8 }
                });

                finalY = doc.lastAutoTable.finalY + 8;
                doc.setFontSize(9);
                doc.text(`Total Masuk: ${formatRupiah(res.summary.masuk)}`, 14, finalY);
                doc.text(`Total Keluar: ${formatRupiah(res.summary.keluar)}`, 14, finalY + 5);
                doc.setFont(undefined, 'bold');
                doc.text(`SALDO AKHIR: ${formatRupiah(res.summary.saldo)}`, 14, finalY + 11);
                doc.setFont(undefined, 'normal');

                finalY += 25;
                if (finalY > 240 && idx < sections.length - 1) {
                    doc.addPage();
                    finalY = 20;
                }
            });

            doc.save(`Rekap_Keuangan_${today.replace(/ /g, '_')}.pdf`);
        }

        render();
    </script>
</body>
</html>
