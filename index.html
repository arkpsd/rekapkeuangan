<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Uang - AI Receipt Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen flex justify-center items-start pt-4 sm:pt-10 px-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl overflow-hidden flex flex-col h-[95vh] sm:h-[85vh]">
        
        <header class="bg-indigo-600 text-white p-4">
            <h1 class="text-xl font-bold text-center mb-4">Rekap Keuangan</h1>
            <div class="flex rounded-lg bg-indigo-800 p-1">
                <button id="tab-pribadi" onclick="switchTab('pribadi')" class="flex-1 py-1.5 text-sm font-semibold rounded-md shadow-sm bg-white text-indigo-700 transition-all">Pribadi</button>
                <button id="tab-kantor" onclick="switchTab('kantor')" class="flex-1 py-1.5 text-sm font-semibold rounded-md text-indigo-100 hover:text-white transition-all">Kantor</button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-4 space-y-5">
            
            <!-- Dashboard -->
            <section class="grid grid-cols-2 gap-3">
                <div class="col-span-2 bg-indigo-50 border border-indigo-100 p-3 rounded-xl">
                    <p class="text-xs text-indigo-600 font-semibold mb-1">Total Saldo (Bulan Ini)</p>
                    <h2 id="sum-saldo" class="text-2xl font-bold text-indigo-700">Rp. 0</h2>
                </div>
                <div class="bg-green-50 border border-green-100 p-3 rounded-xl">
                    <p class="text-xs text-green-600 font-semibold mb-1">Masuk</p>
                    <h3 id="sum-masuk" class="text-md font-bold text-green-700">Rp. 0</h3>
                </div>
                <div class="bg-red-50 border border-red-100 p-3 rounded-xl">
                    <p class="text-xs text-red-600 font-semibold mb-1">Keluar</p>
                    <h3 id="sum-keluar" class="text-md font-bold text-red-700">Rp. 0</h3>
                </div>
            </section>

            <!-- Input Form -->
            <section class="bg-gray-50 p-4 rounded-xl border border-gray-200">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-gray-700">Transaksi Baru</h2>
                    <label class="cursor-pointer bg-indigo-600 text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-indigo-700 transition shadow-md flex items-center space-x-2">
                        <span>📸 Scan Foto Struk</span>
                        <input type="file" id="input-struk" accept="image/*" capture="environment" class="hidden" onchange="processReceipt(event)">
                    </label>
                </div>
                
                <div id="scan-status" class="hidden text-xs font-medium mb-3 px-3 py-2 rounded-lg"></div>
                
                <div class="space-y-3">
                    <div class="flex space-x-2">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="flow" value="keluar" class="peer sr-only" checked>
                            <div class="text-center py-2 rounded-lg border border-gray-300 peer-checked:bg-red-500 peer-checked:text-white peer-checked:border-red-500 text-xs font-bold transition-colors text-gray-600">
                                PENGELUARAN
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="flow" value="masuk" class="peer sr-only">
                            <div class="text-center py-2 rounded-lg border border-gray-300 peer-checked:bg-green-500 peer-checked:text-white peer-checked:border-green-500 text-xs font-bold transition-colors text-gray-600">
                                PEMASUKAN
                            </div>
                        </label>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <select id="input-source" class="p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                            <option value="CASH">💵 CASH</option>
                            <option value="BCA">💳 BCA</option>
                            <option value="BRI">💳 BRI</option>
                            <option value="BANK JATIM">💳 JATIM</option>
                        </select>
                        <input type="text" id="input-amount" oninput="formatInputRupiah(this)" placeholder="Nominal" class="p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none font-bold">
                    </div>
                    
                    <input type="text" id="input-desc" placeholder="Keterangan (Contoh: Beli Makan)" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    
                    <button id="btn-submit" onclick="saveData()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-lg text-sm shadow-md transition-all active:scale-95">
                        Simpan Data
                    </button>
                </div>
            </section>

            <!-- History -->
            <section>
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold text-gray-700">Riwayat</h2>
                    <button onclick="downloadPDF()" class="text-xs text-indigo-600 font-bold hover:underline">Download PDF</button>
                </div>
                <div id="list-history" class="space-y-2 pb-6"></div>
            </section>
        </div>
    </div>

    <script>
        const SCRIPT_URL = ''; 
        let currentTab = 'pribadi';
        let entries = JSON.parse(localStorage.getItem('rekap_uang_v2')) || [];

        function formatRupiah(angka) {
            return 'Rp. ' + new Intl.NumberFormat('id-ID').format(angka);
        }

        function formatInputRupiah(input) {
            let value = input.value.replace(/[^,\d]/g, '').toString();
            let split = value.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);
            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }
            input.value = rupiah ? 'Rp. ' + rupiah : '';
        }

        function unformatRupiah(str) {
            if (!str) return 0;
            return parseInt(str.replace(/[^0-9]/g, '')) || 0;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('tab-pribadi').className = tab === 'pribadi' ? "flex-1 py-1.5 text-sm font-semibold rounded-md shadow-sm bg-white text-indigo-700 transition-all" : "flex-1 py-1.5 text-sm font-semibold rounded-md text-indigo-100 hover:text-white transition-all";
            document.getElementById('tab-kantor').className = tab === 'kantor' ? "flex-1 py-1.5 text-sm font-semibold rounded-md shadow-sm bg-white text-indigo-700 transition-all" : "flex-1 py-1.5 text-sm font-semibold rounded-md text-indigo-100 hover:text-white transition-all";
            render();
        }

        async function saveData() {
            const amountInput = document.getElementById('input-amount').value;
            const amount = unformatRupiah(amountInput);
            const desc = document.getElementById('input-desc').value;
            const source = document.getElementById('input-source').value;
            const flow = document.querySelector('input[name="flow"]:checked').value;

            if (!amount || amount <= 0) { alert("Nominal harus diisi!"); return; }
            if (!desc.trim()) { alert("Keterangan harus diisi!"); return; }

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.innerText = "⏳ Menyimpan...";

            const newEntry = {
                id: Date.now().toString(),
                date: new Date().toISOString(),
                type: currentTab,
                flow: flow,
                source: source,
                amount: amount,
                desc: desc
            };

            entries.push(newEntry);
            localStorage.setItem('rekap_uang_v2', JSON.stringify(entries));

            if (SCRIPT_URL) {
                try {
                    await fetch(SCRIPT_URL, { 
                        method: 'POST', 
                        mode: 'no-cors', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newEntry) 
                    });
                } catch (e) { console.error(e); }
            }

            document.getElementById('input-amount').value = '';
            document.getElementById('input-desc').value = '';
            btnSubmit.disabled = false;
            btnSubmit.innerText = "Simpan Data";
            render();
        }

        function render() {
            const listContainer = document.getElementById('list-history');
            listContainer.innerHTML = '';
            const filtered = entries.filter(e => e.type === currentTab);
            let totalMasuk = 0, totalKeluar = 0;
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();

            filtered.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(entry => {
                const dateObj = new Date(entry.date);
                if (dateObj.getMonth() === currentMonth && dateObj.getFullYear() === currentYear) {
                    if (entry.flow === 'masuk') totalMasuk += entry.amount;
                    else totalKeluar += entry.amount;
                }
                
                const isMasuk = entry.flow === 'masuk';
                const div = document.createElement('div');
                div.className = "bg-white p-3 rounded-xl border border-gray-100 shadow-sm flex justify-between items-center";
                div.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center text-xs ${isMasuk ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}">
                            ${isMasuk ? 'IN' : 'OUT'}
                        </div>
                        <div>
                            <p class="text-sm font-bold text-gray-800">${entry.desc}</p>
                            <p class="text-[10px] text-gray-400">${dateObj.toLocaleDateString('id-ID')} • ${entry.source}</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-sm font-bold ${isMasuk ? 'text-green-600' : 'text-red-600'}">
                            ${isMasuk ? '+' : '-'}${formatRupiah(entry.amount)}
                        </p>
                        <button onclick="deleteItem('${entry.id}')" class="text-[10px] text-gray-300 hover:text-red-500">Hapus</button>
                    </div>
                `;
                listContainer.appendChild(div);
            });

            document.getElementById('sum-saldo').innerText = formatRupiah(totalMasuk - totalKeluar);
            document.getElementById('sum-masuk').innerText = formatRupiah(totalMasuk);
            document.getElementById('sum-keluar').innerText = formatRupiah(totalKeluar);
        }

        function deleteItem(id) {
            if(confirm("Hapus?")) {
                entries = entries.filter(e => e.id !== id);
                localStorage.setItem('rekap_uang_v2', JSON.stringify(entries));
                render();
            }
        }

        async function processReceipt(event) {
            const file = event.target.files[0];
            if (!file) return;
            const statusDiv = document.getElementById('scan-status');
            
            statusDiv.className = "block text-xs font-medium mb-3 px-3 py-2 rounded-lg bg-blue-100 text-blue-700 animate-pulse";
            statusDiv.innerText = "⏳ Menghubungkan ke AI untuk membaca struk...";
            statusDiv.classList.remove('hidden');
            
            try {
                const reader = new FileReader();
                const base64Promise = new Promise(resolve => {
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });
                const base64Data = await base64Promise;
                
                const prompt = "Analisis gambar struk ini secara mendalam. Cari angka TOTAL atau JUMLAH AKHIR yang harus dibayar. Cari juga nama toko atau jenis pembelian utama untuk keterangan. Kembalikan data HANYA dalam format JSON: {\"amount\": integer_tanpa_titik, \"desc\": \"nama_toko_atau_barang\"}. Pastikan amount adalah angka bulat positif.";

                const payload = {
                    contents: [{ 
                        parts: [
                            { text: prompt }, 
                            { inlineData: { mimeType: file.type, data: base64Data } }
                        ] 
                    }],
                    generationConfig: { responseMimeType: "application/json" }
                };
                
                const apiKey = ""; // Dikelola environment
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                const textResponse = result.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (textResponse) {
                    const data = JSON.parse(textResponse);
                    if (data.amount && data.amount > 0) {
                        document.getElementById('input-amount').value = data.amount;
                        formatInputRupiah(document.getElementById('input-amount'));
                        document.getElementById('input-desc').value = data.desc || "Belanja Struk";
                        document.querySelector('input[name="flow"][value="keluar"]').checked = true;

                        statusDiv.className = "block text-xs font-medium mb-3 px-3 py-2 rounded-lg bg-green-100 text-green-700";
                        statusDiv.innerText = "✅ Berhasil membaca struk! Menyimpan ke database...";

                        // Simpan Otomatis
                        setTimeout(async () => {
                            await saveData();
                            statusDiv.innerText = "✅ Data tersimpan otomatis!";
                            setTimeout(() => statusDiv.classList.add('hidden'), 3000);
                        }, 500);
                    } else {
                        throw new Error("Nominal tidak ditemukan");
                    }
                } else {
                    throw new Error("Respon AI kosong");
                }
            } catch (err) {
                console.error(err);
                statusDiv.className = "block text-xs font-medium mb-3 px-3 py-2 rounded-lg bg-red-100 text-red-700";
                statusDiv.innerText = "❌ Gagal membaca struk. Coba foto lebih dekat dan jelas.";
                setTimeout(() => statusDiv.classList.add('hidden'), 5000);
            }
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Laporan Keuangan", 14, 15);
            const rows = entries.map(e => [new Date(e.date).toLocaleDateString(), e.type, e.flow, e.desc, e.amount]);
            doc.autoTable({ head: [['Tanggal', 'Tipe', 'Alur', 'Ket', 'Nominal']], body: rows, startY: 20 });
            doc.save('rekap.pdf');
        }

        render();
    </script>
</body>
</html>
